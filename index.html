<style>
  :root{
    --bg:#F6FAF9; --surface:#FFFFFF; --surface-2:#EFF6F5;
    --text:#16262A; --text-muted:#5C7370;
    --primary:#127C82; --primary-dark:#0B5459; --primary-soft:#E3F2F1;
    --accent:#F4D9B0; --accent-text:#6B4A1E;
    --border:#DCE7E6;
    --danger:#C1503F; --danger-soft:#F8E5E1;
    --success:#3C8A5B; --success-soft:#E4F3EA;
    --warning:#D98B3B; --warning-soft:#FBEEDF;
    --shadow: 0 1px 2px rgba(20,40,40,.06), 0 4px 14px rgba(20,40,40,.06);
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1618; --surface:#142124; --surface-2:#182A2C;
      --text:#E6F1EF; --text-muted:#8FA6A3;
      --primary:#3FB6BC; --primary-dark:#8FD9DC; --primary-soft:#173538;
      --accent:#4A3A23; --accent-text:#F0D3A3;
      --border:#223333;
      --danger:#E88478; --danger-soft:#3A2220;
      --success:#7BC79A; --success-soft:#1D3327;
      --warning:#E7B472; --warning-soft:#3A2C16;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1618; --surface:#142124; --surface-2:#182A2C;
    --text:#E6F1EF; --text-muted:#8FA6A3;
    --primary:#3FB6BC; --primary-dark:#8FD9DC; --primary-soft:#173538;
    --accent:#4A3A23; --accent-text:#F0D3A3;
    --border:#223333;
    --danger:#E88478; --danger-soft:#3A2220;
    --success:#7BC79A; --success-soft:#1D3327;
    --warning:#E7B472; --warning-soft:#3A2C16;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
  }
  *{ box-sizing:border-box; }
  html,body{ overflow-x:hidden; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Rubik', 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--primary); color:#fff; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); }
  .kpi-card{ transition:transform .12s, box-shadow .12s; }
  .kpi-card:hover{ transform:translateY(-2px); box-shadow:0 4px 20px rgba(20,40,40,.12); }
  .scrollbar-thin::-webkit-scrollbar{ height:6px; width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }
  input, select, textarea{
    background:var(--surface); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:9px 12px; font-family:inherit; font-size:14px; width:100%;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary); }
  button{ font-family:inherit; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; padding:9px 16px; font-weight:600; font-size:14px; cursor:pointer; transition:filter .15s, transform .1s; border:1px solid transparent; }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--text); border-color:var(--border); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }
  .icon-btn{ display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; color:var(--text-muted); cursor:pointer; background:transparent; border:1px solid transparent; }
  .icon-btn:hover{ background:var(--surface-2); color:var(--text); }
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap; }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; color:var(--text-muted); font-size:11px; font-weight:600; border-radius:12px; flex:1; cursor:pointer; }
  .nav-item.active{ color:var(--primary); }
  .side-item{ display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:12px; color:var(--text-muted); font-weight:600; font-size:14px; cursor:pointer; }
  .side-item:hover{ background:var(--surface-2); }
  .side-item.active{ background:var(--primary-soft); color:var(--primary); }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,20,20,.45); backdrop-filter:blur(2px); z-index:60; display:flex; align-items:flex-end; justify-content:center; }
  @media(min-width:768px){ .modal-backdrop{ align-items:center; } }
  .modal-panel{ background:var(--surface); width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; box-shadow:var(--shadow); }
  @media(min-width:768px){ .modal-panel{ border-radius:20px; } }
  .fade-in{ animation:fadeIn .18s ease-out; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .toast{ position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 20px; border-radius:99px; font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:80; }
  @media(min-width:768px){ .toast{ bottom:24px; } }
  .kanban-col{ min-width:270px; max-width:270px; }
  .chip{ font-size:12px; padding:4px 10px; border-radius:99px; font-weight:600; border:1px solid var(--border); cursor:pointer; color:var(--text-muted); }
  .chip.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--text-muted); }
  a{ color:var(--primary); text-decoration:none; }
  .tab-btn{ padding:10px 4px; font-weight:600; font-size:14px; color:var(--text-muted); border-bottom:2px solid transparent; cursor:pointer; }
  .tab-btn.active{ color:var(--primary); border-color:var(--primary); }
  .day-cell{ aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; font-size:13px; font-weight:600; }
  button.day-cell{ border:none; background:transparent; font-family:inherit; color:inherit; padding:0; }
  .day-cell:hover{ background:var(--surface-2); }
  .day-cell.today{ outline:2px solid var(--primary); }
  .day-cell.selected{ background:var(--primary); color:#fff; }
  .dot{ width:5px; height:5px; border-radius:99px; background:var(--primary); }

function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function ymd(d){ const dt = (typeof d==='string')? new Date(d) : d; return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(s){ if(!s) return ''; const d=new Date(s); if(isNaN(d)) return s; return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; }
function fmtDateShort(s){ if(!s) return ''; const d=new Date(s); if(isNaN(d)) return s; return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`; }
function fmtDateTime(ms){ if(!ms) return ''; const d=new Date(ms); if(isNaN(d)) return ''; return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function isoToDMY(iso){ if(!iso) return ''; const parts = String(iso).slice(0,10).split('-'); if(parts.length!==3) return ''; const [y,m,d] = parts; if(!y||!m||!d) return ''; return `${d}/${m}/${y}`; }
function isValidDMY(dmy){
  const m = String(dmy||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return false;
  const d=+m[1], mo=+m[2], y=+m[3];
  if(mo<1||mo>12) return false;
  const daysInMonth = new Date(y, mo, 0).getDate();
  return d>=1 && d<=daysInMonth;
}
function dmyToIso(dmy){
  if(!dmy || !dmy.trim()) return '';
  if(!isValidDMY(dmy)) return null; // null = invalid (distinct from '' = empty)
  const [d,mo,y] = dmy.trim().split('/');
  return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
/** Attaches an auto-slash-inserting mask to a DD/MM/YYYY text input. */
function attachDateMask(input){
  if(!input) return;
  input.addEventListener('input', ()=>{
    let digits = input.value.replace(/[^\d]/g,'').slice(0,8);
    let out = digits;
    if(digits.length>4) out = digits.slice(0,2)+'/'+digits.slice(2,4)+'/'+digits.slice(4);
    else if(digits.length>2) out = digits.slice(0,2)+'/'+digits.slice(2);
    input.value = out;
  });
}
/** Reads a DD/MM/YYYY field from a form by name; returns '' if empty,
 *  the ISO date if valid, or throws a user-facing message if invalid. */
function readDMYField(fd, name, label){
  const raw = (fd.get(name)||'').toString();
  if(!raw.trim()) return '';
  const iso = dmyToIso(raw);
  if(iso===null) throw new Error(`תאריך "${label}" אינו תקין — השתמשו בפורמט DD/MM/YYYY`);
  return iso;
}
function waLink(phone){
  if(!phone) return '';
  let digits = String(phone).replace(/\D/g,'');
  if(!digits) return '';
  if(digits.startsWith('0')) digits = '972' + digits.slice(1); // assume Israeli local numbers
  return `https://wa.me/${digits}`;
}
/** Opens the device's native share sheet (WhatsApp, Mail, etc. all appear
 *  there on Android) with the actual file attached, when supported;
 *  otherwise falls back to opening the file so the user can save/forward
 *  it manually. There's no way for a web page to push a file straight
 *  into WhatsApp without going through this native picker. */
/** Opens the device's native share sheet (WhatsApp, Mail, and every other
 *  app that registers as a share target all show up there) with a link
 *  to the file. IMPORTANT: this must call navigator.share() immediately
 *  in the same click handler with no `await` before it — browsers only
 *  allow the Web Share API while it's still clearly "triggered by the
 *  user's tap", and doing a fetch() first (to attach the raw file bytes)
 *  reliably breaks that and silently falls back to nothing happening or
 *  just opening the file. Sharing the link is not a compromise — the
 *  download URL already grants the recipient access, so it opens/plays
 *  correctly on their end without needing to be signed in.
 */
async function shareFileToDevice(url, filename){
  if(navigator.share){
    try{ await navigator.share({title: filename, url}); return; }
    catch(e){ if(e && e.name==='AbortError') return; /* user closed the sheet */ }
  }
  window.open(url, '_blank');
}
function emailFile(url, filename){
  const subject = encodeURIComponent('קובץ מהאפליקציה — '+filename);
  const body = encodeURIComponent('שלום,\n\nהנה קישור לקובץ:\n'+url+'\n');
  window.open(`mailto:?subject=${subject}&body=${body}`, '_self');
}
/** Binds any [data-share-file]/[data-email-file] buttons found under root
 *  (or the whole document if root is omitted) — reused across the media
 *  tab and the per-program gallery. */
function bindShareButtons(root){
  (root||document).querySelectorAll('[data-share-file]').forEach(el=>el.addEventListener('click', ()=>{
    shareFileToDevice(el.getAttribute('data-share-file'), el.getAttribute('data-share-name')||'file');
  }));
  (root||document).querySelectorAll('[data-email-file]').forEach(el=>el.addEventListener('click', ()=>{
    emailFile(el.getAttribute('data-email-file'), el.getAttribute('data-email-name')||'file');
  }));
}
function statusInfo(list,id){ return list.find(x=>x.id===id) || list[0]; }

const firebaseConfig = {

  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",

/** Wraps Firebase Storage to match the {upload(file[,opts]), delete(id)}
 *  shape this app already calls everywhere (upload returns {id, url}). */
function makeStorageAssets(storageRoot){
  return {
    upload: async (file, opts) => {
      const safeName = (file.name||'file').replace(/[^\w.\-]+/g,'_');
      const path = `uploads/${Date.now()}_${Math.random().toString(36).slice(2)}_${safeName}`;
      const ref = storageRoot.ref().child(path);
      const metadata = (opts && opts.type) ? {contentType: opts.type} : undefined;
      await ref.put(file, metadata);
      const url = await ref.getDownloadURL();
      return {id: path, url};
    },
    delete: async (id) => { try{ await storageRoot.ref().child(id).delete(); }catch(e){} },
  };
}
/** Real browser download (works normally on a real hosted domain — unlike
 *  inside a sandboxed artifact iframe, so no special capability is needed). */
function makeLocalDownloads(){
  return {
    save: async ({filename, data}) => {
      const blob = (data instanceof Blob) ? data : new Blob([data], {type: /\.json$/i.test(filename) ? 'application/json' : 'application/octet-stream'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      return {filename};
    },
  };
}
async function initCapabilities(){
  S.downloads = makeLocalDownloads(); // always available on a real hosted page
  if(!firebaseIsConfigured()){
    S.db = null; S.assets = null; S.dbAvailable = false; S.dbReady = true; render();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInAnonymously();
    S.db = firebase.firestore();
    S.assets = makeStorageAssets(firebase.storage());
  }catch(e){ console.error('Firebase init failed', e); S.db = null; S.assets = null; }
  S.dbAvailable = !!S.db;
  if(S.db){ subscribeAll(); }
  S.dbReady = true;
  render();
}

function subscribeAll(){
  const subs = [
    ['clients','clients'], ['programs','programs'], ['sessions','sessions'],
    ['tasks','tasks'], ['activityLogs','activity_logs'], ['team','team'],
  ];
  subs.forEach(([key,col])=>{
    S.db.collection(col).onSnapshot(snap=>{
      S[key] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }, err=>{ console.warn('snapshot error', col, err); });
  });
  S.db.doc('org/main').onSnapshot(snap=>{
    if(snap.exists) S.org = {name:'הקליניקה שלי', ...snap.data()};
    render();
  });
}

async function exportZip(){
  if(!S.downloads){ toast('יש להגדיר קודם Firebase (ראו README.md) כדי לייצא נתונים'); return; }
  if(!window.JSZip){ toast('ספריית ה-ZIP לא נטענה, נסו לרענן'); return; }
  toast('מכין קובץ ZIP…');
  try{
    const zip = new JSZip();
    const payload = buildExportPayload();
    const clientsCopy = JSON.parse(JSON.stringify(payload.clients));
    for(const c of clientsCopy){
      if(c.gallery && c.gallery.length){
        for(let i=0;i<c.gallery.length;i++){
          const g = c.gallery[i];
          try{
            const resp = await fetch(g.url); const blob = await resp.blob();
            const ext = (blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');
            const fname = `images/${c.id}_${i}.${ext}`;
            zip.file(fname, blob);
            g.zip_file = fname;
          }catch(e){ /* skip image that failed to fetch */ }
        }
      }
    }
    payload.clients = clientsCopy;
    zip.file('data.json', JSON.stringify(payload, null, 2));
    const blob = await zip.generateAsync({type:'blob'});
    await S.downloads.save({ filename:`ייצוא-נתונים-${todayIso()}.zip`, data: blob });
    toast('הקובץ נשמר');
  }catch(e){ if(e && e.code!=='declined') toast('הייצוא נכשל: '+(e.message||e.code||'')); }
}
async function handleImportFile(file){
  if(!S.db){ toast('אין חיבור ל-Firebase - יש להגדיר firebaseConfig קודם (ראו README.md)'); return; }
  try{
    let payload, zip = null, mediaIndex = null;
    if(/\.zip$/i.test(file.name)){
      if(!window.JSZip){ toast('ספריית ה-ZIP לא נטענה, נסו לרענן'); return; }
      zip = await JSZip.loadAsync(file);
      const jsonNames = Object.keys(zip.files).filter(n=>/\.json$/i.test(n) && !zip.files[n].dir);
      if(jsonNames.length===0){ toast('לא נמצא קובץ JSON בתוך קובץ ה-ZIP'); return; }
      const findEntry = suffix => jsonNames.find(n=>n.toLowerCase().endsWith(suffix));

      // Case C: a multi-table export (data/clients.json, data/programs.json, ...)
      const clientsFile = findEntry('data/clients.json');
      if(clientsFile){
        const readJson = async name => { try{ return JSON.parse(await zip.file(name).async('text')); }catch(e){ return null; } };
        const clients = await readJson(clientsFile);
        const programs = await readJson(findEntry('data/programs.json') || '') || [];
        const sessions = await readJson(findEntry('data/sessions.json') || '') || [];
        const tasks = await readJson(findEntry('data/tasks.json') || '') || [];
        const activityLogs = await readJson(findEntry('data/activity_logs.json') || '') || [];
        const mediaIdx = await readJson(findEntry('data/media_index.json') || '') || [];
        const profiles = await readJson(findEntry('data/profiles.json') || '') || [];
        mediaIndex = [...(Array.isArray(mediaIdx)?mediaIdx:[]), ...(Array.isArray(profiles)?profiles:[])];
        if(mediaIndex.length) S.lastMediaIndex = mediaIndex;
        const converted = convertExternalBackup({clients: clients||[], programs, sessions, tasks, activityLogs}, mediaIndex);
        await runImport(converted, zip, {external:true, mediaIndex});
        return;
      }

      // Case A/B: one combined export file (our own, or another single-file external backup)
      let mainName = jsonNames.find(n=>/data\.json$/i.test(n)) || jsonNames.find(n=>/backup\.json$/i.test(n)) || jsonNames[0];
      payload = JSON.parse(await zip.file(mainName).async('text'));
      const otherName = jsonNames.find(n=>n!==mainName);
      if(otherName){ try{ mediaIndex = JSON.parse(await zip.file(otherName).async('text')); if(Array.isArray(mediaIndex)) S.lastMediaIndex = mediaIndex; }catch(e){ mediaIndex=null; } }
    } else {
      payload = JSON.parse(await file.text());
    }

    const isNative = payload && payload.format === 'mindflow-export';
    const looksExternal = payload && Array.isArray(payload.clients) && payload.clients.length>0 &&
      ('organization_id' in payload.clients[0] || Array.isArray(payload.programs) || Array.isArray(payload.activityLogs));

    if(isNative){
      await runImport(payload, zip, {external:false});
    } else if(looksExternal){
      const converted = convertExternalBackup(payload, mediaIndex);
      await runImport(converted, zip, {external:true, mediaIndex});
    } else {
      toast('מבנה הקובץ אינו מוכר — לא ניתן לייבא');
    }
  }catch(e){ console.error(e); toast('קובץ לא תקין — הייבוא נכשל'); }
}

/** Maps an export from the external Kabbalah-CRM-style app (clients/programs/
 *  sessions/tasks/activityLogs with organization_id, uuid assigned_to, etc.)
 *  into this app's internal shape. */
function convertExternalBackup(data, mediaIndex){
  const profiles = {};
  if(Array.isArray(mediaIndex)) mediaIndex.forEach(x=>{ if(x && x.full_name && x.email && x.id) profiles[x.id]=x.full_name; });
  const nameFor = uuid => uuid ? (profiles[uuid]||'') : '';
  const dateOnly = s => s ? String(s).slice(0,10) : '';
  const timeOnly = s => { if(!s) return ''; const t = String(s).includes('T')? String(s).split('T')[1] : s; return t.slice(0,5); };
  const actionLabels = {program_created:'תוכנית נוצרה', program_updated:'תוכנית עודכנה', session_completed:'סשן הושלם', live_reading:'קריאה חיה', client_created:'לקוח נוצר', client_updated:'לקוח עודכן'};

  const clients = (data.clients||[]).map(c=>({
    id:c.id, full_name:c.full_name||'ללא שם', phone:c.phone||'', email:c.email||'',
    status: ['lead','consultation','active','inactive'].includes(c.status) ? c.status : 'lead',
    date_of_birth: dateOnly(c.date_of_birth), mother_name:c.mother_name||'',
    selected_reading:c.selected_reading||'', partner_full_name:c.partner_full_name||'',
    partner_dob: dateOnly(c.partner_dob), partner_mother_name:c.partner_mother_name||'',
    assigned_to: nameFor(c.assigned_to), notes:c.notes||'', address:c.address||'', gallery:[], audio_links:[],
  }));
  const programs = (data.programs||[]).map(p=>({
    id:p.id, client_id:p.client_id||'', total_sessions: p.total_sessions||1,
    weekly_days: Array.isArray(p.weekly_days)? p.weekly_days : [],
    session_time: (p.session_time || (Array.isArray(p.session_times)&&p.session_times[0]) || '').slice(0,5),
    start_date: dateOnly(p.start_date), status: p.status||'active', assigned_to: nameFor(p.assigned_to),
  }));
  const sessions = (data.sessions||[]).map(s=>({
    id:s.id, program_id:s.program_id||'', client_id:s.client_id||'',
    session_date: dateOnly(s.session_date), session_time: timeOnly(s.session_date),
    status: Object.keys(SESSION_STATUSES).includes(s.status) ? s.status : 'scheduled',
    notes: s.notes||'', assigned_to: nameFor(s.assigned_to), images:[],
  }));
  const tasks = (data.tasks||[]).map(t=>({
    id:t.id, title:t.title||'משימה', description:t.description||'',
    priority: TASK_PRIORITIES.some(p=>p.id===t.priority) ? t.priority : 'medium',
    status: t.status==='done' ? 'done' : 'todo', due_date: dateOnly(t.due_date),
    client_id: t.client_id||'', assigned_to: nameFor(t.assigned_to),
  }));
  const activity_logs = (data.activityLogs||[]).map(a=>({
    client_id:a.client_id||'', action: actionLabels[a.action] || a.action || 'פעולה',
    actor: nameFor(a.user_id) || 'מערכת חיצונית', at: a.created_at ? new Date(a.created_at).getTime() : Date.now(),
  }));
  return {format:'mindflow-export', source:'external', clients, programs, sessions, tasks, activity_logs, team:[]};
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function addWithRetry(col, data){
  for(let attempt=0; attempt<4; attempt++){
    try{ return await S.db.collection(col).add(data); }
    catch(e){
      if(e && (e.code==='resource_exhausted' || e.code==='unavailable') && attempt<3){ await sleep(350*(attempt+1)); continue; }
      throw e;
    }
  }
}

function updateImportProgress(done, total, label){
  const bar = document.getElementById('import-bar'); const txt = document.getElementById('import-txt');
  if(bar) bar.style.width = Math.max(2, Math.round(done/Math.max(total,1)*100))+'%';

/** Runs the actual import (used for both our own re-imported exports and
 *  converted external backups, both normalized to the same internal shape). */
async function runImport(payload, zip, opts){
  if(!payload || !Array.isArray(payload.clients)){ toast('מבנה הקובץ אינו תואם למערכת'); return; }
  const nProg = (payload.programs||[]).length, nSess = (payload.sessions||[]).length,
        nTask = (payload.tasks||[]).length, nLog = (payload.activity_logs||[]).length;
  const summary = `${payload.clients.length} לקוחות, ${nProg} תוכניות, ${nSess} סשנים, ${nTask} משימות${nLog?`, ${nLog} רשומות יומן פעילות`:''}`;
  const originNote = opts.external ? '\n\n(זוהה כקובץ גיבוי מאפליקציה חיצונית — השדות יותאמו אוטומטית. שיוך אנשי צוות ישוחזר רק אם שמם נמצא בקובץ.)' : '';
  if(!(await askConfirm(`לייבא ${summary}?${originNote}\n\nהפעולה מוסיפה נתונים חדשים ואינה מוחקת נתונים קיימים.`, {title:'ייבוא נתונים'}))) return;

  const total = payload.clients.length + nProg + nSess + nTask + nLog;
  let done = 0;
  showImportProgress();
  const typeMap = {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp'};
  const clientIdMap = {}, programIdMap = {};
  let skippedMedia = 0;

  try{
    for(const c of payload.clients){
      const {id, gallery, ...rest} = c;
      let newGallery = [];
      if(zip && S.assets && gallery && gallery.length){
        for(const g of gallery){
          if(!g.zip_file) continue;
          try{
            const fileEntry = zip.file(g.zip_file);
            if(!fileEntry) continue;
            const blob = await fileEntry.async('blob');
            const ext = g.zip_file.split('.').pop().toLowerCase();
            const res = await S.assets.upload(blob, {type: typeMap[ext] || 'image/jpeg'});
            newGallery.push({id:res.id, url:res.url});
          }catch(e){ skippedMedia++; }
        }
      }
      // external-format image attachment via a separate media index catalog
      if(opts.external && zip && S.assets && Array.isArray(opts.mediaIndex)){
        const matches = opts.mediaIndex.filter(m=>m && m.kind==='image' && m.client_id===id && m.zip_path);
        for(const m of matches){
          try{
            const fileEntry = zip.file(m.zip_path);
            if(!fileEntry) continue;
            const blob = await fileEntry.async('blob');
            const res = await S.assets.upload(blob, {type: m.mime_type && !m.mime_type.includes(';') ? m.mime_type : undefined});
            newGallery.push({id:res.id, url:res.url});
          }catch(e){ skippedMedia++; }
        }
      }
      const ref = await addWithRetry('clients', {...rest, gallery:newGallery, created_at:Date.now(), created_by:S.me?.name||'—'});
      if(id) clientIdMap[id] = ref.id;
      done++; updateImportProgress(done, total, 'לקוחות');
    }
    for(const p of (payload.programs||[])){
      const {id, client_id, ...rest} = p;
      const ref = await addWithRetry('programs', {...rest, client_id: clientIdMap[client_id]||client_id||'', created_at:Date.now(), created_by:S.me?.name||'—'});
      if(id) programIdMap[id] = ref.id;
      done++; updateImportProgress(done, total, 'תוכניות');
    }
    for(const s of (payload.sessions||[])){
      const {id, client_id, program_id, ...rest} = s;
      await addWithRetry('sessions', {...rest, client_id: clientIdMap[client_id]||client_id||'', program_id: programIdMap[program_id]||program_id||'', created_at:Date.now(), created_by:S.me?.name||'—'});
      done++; if(done%5===0 || done===total) updateImportProgress(done, total, 'סשנים');
    }
    for(const t of (payload.tasks||[])){
      const {id, client_id, ...rest} = t;
      await addWithRetry('tasks', {...rest, client_id: client_id ? (clientIdMap[client_id]||client_id) : '', created_at:Date.now(), created_by:S.me?.name||'—'});
      done++; updateImportProgress(done, total, 'משימות');
    }
    for(const l of (payload.activity_logs||[])){
      const {client_id, ...rest} = l;
      await addWithRetry('activity_logs', {...rest, client_id: client_id ? (clientIdMap[client_id]||client_id) : ''});
      done++; if(done%5===0 || done===total) updateImportProgress(done, total, 'יומן פעילות');
    }
    closeModal();
    toast(skippedMedia ? `הייבוא הושלם 🎉 (${skippedMedia} קבצי מדיה לא יובאו)` : 'הייבוא הושלם בהצלחה 🎉');
  }catch(e){ console.error(e); closeModal(); toast('אירעה שגיאה באמצע הייבוא — חלק מהנתונים כבר נשמרו'); }
  render();
}

/* ============================== BULK MEDIA FOLDER IMPORT ============================== */
async function handleMediaMapFile(file){
  try{
    const payload = JSON.parse(await file.text());
    if(Array.isArray(payload)){ S.lastMediaIndex = payload; toast(`מיפוי מדיה נטען (${payload.length} רשומות)`); render(); }
    else toast('הקובץ אינו רשימת מיפוי מדיה תקינה (מצופה מערך JSON)');
  }catch(e){ toast('שגיאה בקריאת קובץ המיפוי'); }
}

const UPLOAD_TYPE_BY_EXT = {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp4:'video/mp4',webm:'video/webm',pdf:'application/pdf'};
function resolveUploadType(file){
  const ACCEPTED = ['image/png','image/jpeg','image/gif','image/webp','image/svg+xml','video/mp4','video/webm','application/pdf'];
  if(file.type && ACCEPTED.includes(file.type)) return file.type;
  const ext = file.name.split('.').pop().toLowerCase();
  return UPLOAD_TYPE_BY_EXT[ext] || null;
}
/** Best-effort match of an uploaded file to a client id, using (in order):
 *  an exact suffix match against a loaded media-index catalog's zip_path,
 *  a filename match against that catalog, a UUID found in the file's path,
 *  a client-id-prefix folder pattern ("name__abcd1234"), or a folder/file
 *  name that equals a client's full name exactly. */
function matchClientForFile(file){
  const relPath = (file.webkitRelativePath || file.name).replace(/\\/g,'/');
  const baseName = file.name;
  if(Array.isArray(S.lastMediaIndex)){
    let hit = S.lastMediaIndex.find(m=>m && m.zip_path && relPath.endsWith(m.zip_path));
    if(!hit) hit = S.lastMediaIndex.find(m=>m && (m.file_name===baseName || m.original_file_name===baseName || m.name===baseName));
    if(hit){
      if(hit.client_id && clientById(hit.client_id)) return hit.client_id;
      if(hit.entityId && clientById(hit.entityId)) return hit.entityId;
    }
  }
  const uuidMatch = relPath.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
  if(uuidMatch){
    const full = uuidMatch[0].toLowerCase();
    const c = S.clients.find(c=>c.id && c.id.toLowerCase()===full) || S.clients.find(c=>c.id && c.id.toLowerCase().startsWith(full.slice(0,8)));
    if(c) return c.id;
  }
  const segMatch = relPath.match(/__([0-9a-f]{6,8})/i);
  if(segMatch){
    const c = S.clients.find(c=>c.id && c.id.toLowerCase().startsWith(segMatch[1].toLowerCase()));
    if(c) return c.id;
  }
  for(const part of relPath.split('/')){
    const nameGuess = part.split('__')[0].trim();
    if(nameGuess.length<2) continue;
    const c = S.clients.find(c=>c.full_name && c.full_name===nameGuess);
    if(c) return c.id;
  }
  return null;
}
async function uploadWithRetry(file, type){
  for(let attempt=0; attempt<4; attempt++){
    try{ return await S.assets.upload(file, type?{type}:undefined); }
    catch(e){
      if(e && (e.code==='rate_limited' || e.code==='store_unavailable') && attempt<3){ await sleep(400*(attempt+1)); continue; }
      throw e;
    }
  }
}
async function handleMediaFolder(fileList){
  if(!S.assets){ toast('העלאת קבצים לא זמינה - יש להגדיר Firebase Storage קודם (ראו README.md)'); return; }
  const files = Array.from(fileList||[]);
  if(!files.length) return;
  const matched = [], unmatched = [], unsupported = [];
  for(const f of files){
    const type = resolveUploadType(f);
    if(!type){ unsupported.push(f); continue; }
    const clientId = matchClientForFile(f);
    if(!clientId){ unmatched.push(f); continue; }
    matched.push({file:f, type, clientId});
  }
  const parts = [];
  if(unmatched.length) parts.push(`${unmatched.length} קבצים לא זוהו`);
  if(unsupported.length) parts.push(`${unsupported.length} קבצים בפורמט לא נתמך (כולל אודיו)`);
  if(matched.length===0){ toast(`לא הועלה כלום. ${parts.join(', ')||'לא נמצאו קבצים תואמים'}.`); return; }
  const clientCount = new Set(matched.map(m=>m.clientId)).size;
  if(!(await askConfirm(`נמצאה התאמה ל-${matched.length} מתוך ${files.length} קבצים, עבור ${clientCount} לקוחות.${parts.length? '\n'+parts.join(', ')+' ולא יועלו.':''}\n\nלהמשיך בהעלאה?`, {title:'ייבוא מדיה'}))) return;

  showImportProgress(); let done=0; let failed=0;
  const galleryAdds = {};
  for(const {file, type, clientId} of matched){
    try{
      const res = await uploadWithRetry(file, type);
      (galleryAdds[clientId] ||= []).push({id:res.id, url:res.url});
    }catch(e){ failed++; }
    done++; updateImportProgress(done, matched.length, 'קבצי מדיה');
  }
  for(const [clientId, adds] of Object.entries(galleryAdds)){
    const c = clientById(clientId);
    const gallery = [...((c&&c.gallery)||[]), ...adds];
    try{ await dbUpdate('clients', clientId, {gallery}); }catch(e){}
  }
  closeModal();
  toast(`הועלו ${matched.length-failed} קבצים ל-${Object.keys(galleryAdds).length} לקוחות${failed?` (${failed} נכשלו)`:''}`);
  render();
}

function clientById(id){ return S.clients.find(c=>c.id===id); }
function programsForClient(id){ return S.programs.filter(p=>p.client_id===id).sort((a,b)=>(a.start_date||'').localeCompare(b.start_date||'')); }

function computeSessionDates(startDate, weeklyDays, total, perDay=1){
  const dates=[]; let d = new Date(startDate+'T00:00:00'); let guard=0;
  perDay = Math.min(7, Math.max(1, perDay||1));
  while(dates.length < total && guard < 3000){
    if(weeklyDays.includes(d.getDay())){
      for(let i=0; i<perDay && dates.length<total; i++) dates.push(new Date(d));
    }
    d.setDate(d.getDate()+1); guard++;
  }
  return dates;
}
/** Expands (startDate, weeklyDays, count, perDay) into concrete
 *  {session_date, session_time} slots, cycling through `times` for the
 *  Nth session within each matching day (so a 2-per-day program can have
 *  a morning time and an evening time instead of one time for both). */
function buildSessionSlots(startDate, weeklyDays, count, perDay, times){
  const dates = computeSessionDates(startDate, weeklyDays, count, perDay);
  const p = Math.min(7, Math.max(1, perDay||1));
  const dayCounter = {};
  return dates.map(d=>{
    const iso = ymd(d);
    dayCounter[iso] = dayCounter[iso]||0;
    const slotIdx = dayCounter[iso] % p;
    const t = (times && (times[slotIdx]||times[0])) || '';
    dayCounter[iso]++;
    return {session_date: iso, session_time: t};
  });
}
async function generateSessionsForProgram(program, ref){
  const times = (program.session_times&&program.session_times.length) ? program.session_times : [program.session_time||''];
  const slots = buildSessionSlots(program.start_date, program.weekly_days, program.total_sessions, program.sessions_per_day, times);
  for(const slot of slots){
    await S.db.collection('sessions').add({
      program_id: ref.id, client_id: program.client_id,
      session_date: slot.session_date, session_time: slot.session_time,
      status:'scheduled', notes:'', images:[], assigned_to: program.assigned_to||'',
      created_at: Date.now(), created_by: S.me?.name||'—',
    });
  }
}
/** Used when editing a program with "regenerate" checked: wipes every
 *  not-yet-completed session for it and rebuilds the schedule from the
 *  (possibly changed) parameters, leaving completed sessions untouched. */
async function regenerateProgramSessions(program){
  const existing = sessionsForProgram(program.id);
  const completedCount = existing.filter(s=>s.status==='completed').length;
  for(const s of existing){ if(s.status!=='completed') await dbDelete('sessions', s.id); }
  const remaining = Math.max(0, program.total_sessions - completedCount);
  if(remaining<=0) return;
  const times = (program.session_times&&program.session_times.length) ? program.session_times : [program.session_time||''];
  const slots = buildSessionSlots(program.start_date, program.weekly_days, remaining, program.sessions_per_day, times);
  for(const slot of slots){
    await S.db.collection('sessions').add({
      program_id: program.id, client_id: program.client_id,
      session_date: slot.session_date, session_time: slot.session_time,
      status:'scheduled', notes:'', images:[], assigned_to: program.assigned_to||'',
      created_at: Date.now(), created_by: S.me?.name||'—',
    });
  }
}

function renderDashboard(){
  const activeClients = S.clients.filter(c=>c.status==='active').length;
  const weekStart = new Date(); weekStart.setDate(weekStart.getDate() - weekStart.getDay());
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+7);
  const sessionsWeek = S.sessions.filter(s=>{ const d=new Date(s.session_date); return d>=weekStart && d<weekEnd && s.status==='scheduled'; }).length;
  const openTasks = S.tasks.filter(t=>t.status!=='done').length;
  const newLeads = S.clients.filter(c=>c.status==='lead').length;

  const todaySessions = S.sessions.filter(isTodaySession).sort((a,b)=>(a.session_time||'').localeCompare(b.session_time||''));
  const urgentTasks = S.tasks.filter(t=>t.status!=='done').sort((a,b)=>{
    const order={urgent:0,high:1,medium:2,low:3};
    return (order[a.priority]??2)-(order[b.priority]??2) || (a.due_date||'').localeCompare(b.due_date||'');
  }).slice(0,6);

  const kpis = [
    ['לקוחות פעילים', activeClients, 'users', 'var(--primary)', '#/clients'],
    ['סשנים השבוע', sessionsWeek, 'calendar', 'var(--success)', '#/calendar'],
    ['משימות פתוחות', openTasks, 'tasks', 'var(--warning)', '#/tasks'],
    ['לידים חדשים', newLeads, 'sparkle', 'var(--accent-text)', '#/clients'],
  ];

  return `
    <div class="fade-in">
      <div class="mb-5">
        <h1 class="text-2xl font-bold">שלום, ${esc((S.me.name||'').split(' ')[0])} 👋</h1>

            <div class="flex items-center justify-between mb-2">
              <span style="color:${color}">${icon(i,20)}</span>
              <span style="color:var(--text-muted)">${icon('chevL',14)}</span>
            </div>
            <div class="text-2xl font-bold">${val}</div>
            <div style="color:var(--text-muted); font-size:12.5px;">${label}</div>
          </div>`).join('')}
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="card p-4">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-bold">סשנים היום</h2>
            <span class="badge" style="background:var(--primary-soft); color:var(--primary)">${todaySessions.length}</span>
          </div>
          ${todaySessions.length? `<div class="flex flex-col gap-2">${todaySessions.map(s=>{
            const c = clientById(s.client_id);
            return `<div class="flex items-center gap-3 p-2.5 rounded-xl cursor-pointer" data-go="#/clients/${s.client_id}/clinical" style="background:var(--surface-2)">
              <div class="font-semibold" style="min-width:48px; color:var(--primary)">${s.session_time||'—'}</div>
              <div class="flex-1 min-w-0"><div class="font-semibold truncate">${esc(c? c.full_name:'לקוח לא ידוע')}</div></div>
              <span class="badge" style="background:${SESSION_STATUSES[s.status].color}22; color:${SESSION_STATUSES[s.status].color}">${SESSION_STATUSES[s.status].label}</span>
            </div>`;
          }).join('')}</div>` : `<div class="empty-state">אין סשנים מתוזמנים להיום</div>`}
        </div>
        <div class="card p-4">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-bold">משימות דחופות</h2>
            <span class="badge" style="background:var(--warning-soft); color:var(--warning)">${openTasks}</span>
          </div>
          ${urgentTasks.length? `<div class="flex flex-col gap-2">${urgentTasks.map(t=>{
            const p = statusInfo(TASK_PRIORITIES, t.priority);
            return `<div class="flex items-center gap-3 p-2.5 rounded-xl cursor-pointer" data-go="#/tasks" style="background:var(--surface-2)">
              <span class="badge" style="background:${p.color}22; color:${p.color}">${p.label}</span>
              <div class="flex-1 min-w-0"><div class="font-semibold truncate">${esc(t.title)}</div></div>
              ${t.due_date? `<div style="color:var(--text-muted); font-size:12px;">${fmtDateShort(t.due_date)}</div>`:''}
            </div>`;
          }).join('')}</div>` : `<div class="empty-state">אין משימות פתוחות 🎉</div>`}
        </div>
      </div>
    </div>`;
}
function bindDashboard(){ document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click', ()=>go(el.getAttribute('data-go')))); }

/* ============================== CLIENTS (PIPELINE) ============================== */
function renderClients(){
  const q = S.clientSearch.trim().toLowerCase();
  let list = S.clients.filter(c=> !q || (c.full_name||'').toLowerCase().includes(q) || (c.phone||'').includes(q));

  return `
  <div class="fade-in">
    <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
      <h1 class="text-xl font-bold">לקוחות</h1>
      <div class="flex items-center gap-2">
        <div class="relative">
          <span style="position:absolute; right:10px; top:9px; color:var(--text-muted);">${icon('search',16)}</span>
          <input id="client-search" placeholder="חיפוש לקוח…" style="padding-right:32px; width:200px;" value="${esc(S.clientSearch)}">
        </div>
        <button class="btn btn-primary" data-new-client>${icon('plus',16)} לקוח חדש</button>
      </div>
    </div>

    <!-- Desktop kanban -->
    <div class="hidden md:flex gap-4 overflow-x-auto pb-2 scrollbar-thin">
      ${CLIENT_STATUSES.map(st=>{
        const items = list.filter(c=>c.status===st.id);
        return `<div class="kanban-col flex flex-col gap-2" data-col="${st.id}">
          <div class="flex items-center gap-2 px-1 mb-1">
            <span class="dot" style="background:${st.color}"></span>
            <span class="font-semibold" style="font-size:14px;">${st.label}</span>
            <span style="color:var(--text-muted); font-size:12px;">${items.length}</span>
          </div>
          <div class="flex flex-col gap-2 min-h-[60px]" data-dropzone="${st.id}">
            ${items.map(c=>clientCard(c)).join('') || `<div style="border:1.5px dashed var(--border); border-radius:12px; padding:16px; text-align:center; color:var(--text-muted); font-size:12px;">גררו לקוח לכאן</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Mobile accordion -->
    <div class="md:hidden flex flex-col gap-2">
      ${CLIENT_STATUSES.map(st=>{
        const items = list.filter(c=>c.status===st.id);
        return `<div class="card">
          <div class="flex items-center justify-between p-3 cursor-pointer" data-accordion="${st.id}">
            <div class="flex items-center gap-2">
              <span class="dot" style="background:${st.color}"></span>
              <span class="font-semibold" style="font-size:14px;">${st.label}</span>
              <span style="color:var(--text-muted); font-size:12px;">(${items.length})</span>
            </div>
            <span style="transform:${S['acc_'+st.id]?'rotate(180deg)':''}; transition:transform .15s;">${icon('chevDown',18)}</span>
          </div>
          ${S['acc_'+st.id] ? `<div class="flex flex-col gap-2 px-3 pb-3">${items.map(c=>clientCard(c,true)).join('') || `<div class="empty-state" style="padding:14px;">אין לקוחות בסטטוס זה</div>`}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function clientCard(c, mobile){
  const st = statusInfo(CLIENT_STATUSES, c.status);
  const idx = CLIENT_STATUSES.findIndex(s=>s.id===c.status);
  const next = CLIENT_STATUSES[idx+1];
  return `<div class="card p-3 cursor-pointer" ${mobile?'':'draggable="true"'} data-client-card="${c.id}" data-go="#/clients/${c.id}">
    <div class="flex items-center justify-between mb-1">
      <div class="font-semibold truncate">${esc(c.full_name)}</div>
      ${mobile && next ? `<button class="icon-btn" style="width:28px;height:28px;" data-advance="${c.id}" data-next="${next.id}" title="קדם ל${next.label}">${icon('chevL',15)}</button>` : ''}
    </div>
    ${c.phone? `<a href="${esc(waLink(c.phone))}" target="_blank" rel="noopener" data-wa style="color:#25D366; font-size:12.5px;" class="flex items-center gap-1 w-fit">${icon('whatsapp',13)}${esc(c.phone)}</a>`:''}
    ${c.selected_reading? `<div class="mt-2 px-2 py-1 rounded-lg inline-block" style="background:var(--accent); color:var(--accent-text); font-size:11.5px; font-weight:600;">${esc(c.selected_reading)}</div>`:''}
  </div>`;
}
function bindClients(){
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click', (e)=>{ if(e.target.closest('[data-advance]') || e.target.closest('[data-wa]')) return; go(el.getAttribute('data-go')); }));
  const search = document.getElementById('client-search');
  if(search){ search.addEventListener('input', e=>{ S.clientSearch = e.target.value; render(); document.getElementById('client-search').focus(); document.getElementById('client-search').selectionStart = document.getElementById('client-search').value.length; }); }
  document.querySelector('[data-new-client]')?.addEventListener('click', ()=>openClientModal());
  document.querySelectorAll('[data-accordion]').forEach(el=>el.addEventListener('click', ()=>{ const k='acc_'+el.getAttribute('data-accordion'); S[k]=!S[k]; render(); }));
  document.querySelectorAll('[data-advance]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const id = el.getAttribute('data-advance'), next = el.getAttribute('data-next');
    dbUpdate('clients', id, {status:next}); logActivity(id, `סטטוס שונה ל־${statusInfo(CLIENT_STATUSES,next).label}`);
  }));
  // drag & drop desktop
  document.querySelectorAll('[data-client-card]').forEach(el=>{
    el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', el.getAttribute('data-client-card')); });
  });
  document.querySelectorAll('[data-dropzone]').forEach(zone=>{
    zone.addEventListener('dragover', e=>e.preventDefault());
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      const newStatus = zone.getAttribute('data-dropzone');
      const c = clientById(id);
      if(c && c.status!==newStatus){ dbUpdate('clients', id, {status:newStatus}); logActivity(id, `סטטוס שונה ל־${statusInfo(CLIENT_STATUSES,newStatus).label}`); }
    });
  });
}

function openClientModal(existing){
  const isEdit = !!existing;
  const c = existing || {};
  showModal(`
    <div class="p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-lg">${isEdit? 'עריכת לקוח':'לקוח חדש'}</h2>
        <button class="icon-btn" data-close>${icon('x',18)}</button>
      </div>
      <form id="client-form" class="flex flex-col gap-3">
        <label class="text-sm font-semibold">שם מלא *<input name="full_name" required value="${esc(c.full_name||'')}" class="mt-1"></label>
        <div class="grid grid-cols-2 gap-3">
          <label class="text-sm font-semibold">טלפון<input name="phone" value="${esc(c.phone||'')}" class="mt-1"></label>
          <label class="text-sm font-semibold">אימייל<input name="email" type="email" value="${esc(c.email||'')}" class="mt-1"></label>
        </div>
        <label class="text-sm font-semibold">כתובת<input name="address" value="${esc(c.address||'')}" class="mt-1"></label>
        <div class="grid grid-cols-2 gap-3">
          <label class="text-sm font-semibold">תאריך לידה<input name="date_of_birth" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" data-date-mask value="${esc(isoToDMY(c.date_of_birth))}" class="mt-1"></label>
          <label class="text-sm font-semibold">שם האם<input name="mother_name" value="${esc(c.mother_name||'')}" class="mt-1"></label>
        </div>
        <label class="text-sm font-semibold">קריאה נבחרת<input name="selected_reading" value="${esc(c.selected_reading||'')}" class="mt-1" placeholder="למשל: קריאת מראה"></label>
        <div class="rounded-xl p-3" style="background:var(--surface-2)">
          <div class="font-semibold text-sm mb-2">פרטי בן/בת זוג (אופציונלי)</div>
          <div class="flex flex-col gap-2">
            <input name="partner_full_name" placeholder="שם מלא" value="${esc(c.partner_full_name||'')}">
            <div class="grid grid-cols-2 gap-2">
              <input name="partner_dob" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" data-date-mask value="${esc(isoToDMY(c.partner_dob))}">
              <input name="partner_mother_name" placeholder="שם האם" value="${esc(c.partner_mother_name||'')}">
            </div>
          </div>
        </div>
        <label class="text-sm font-semibold">הערות<textarea name="notes" rows="3" class="mt-1" placeholder="הערות כלליות, תיעוד שיחות וכו׳">${esc(c.notes||'')}</textarea></label>
        <div class="grid grid-cols-2 gap-3">
          <label class="text-sm font-semibold">סטטוס
            <select name="status" class="mt-1">${CLIENT_STATUSES.map(s=>`<option value="${s.id}" ${c.status===s.id?'selected':''}>${s.label}</option>`).join('')}</select>
          </label>
          <label class="text-sm font-semibold">אחראי/ת
            <select name="assigned_to" class="mt-1">
              <option value="">—</option>
              ${teamNames().map(n=>`<option value="${esc(n)}" ${c.assigned_to===n?'selected':''}>${esc(n)}</option>`).join('')}
            </select>
          </label>
        </div>
        <div class="flex gap-2 mt-2">
          <button type="submit" class="btn btn-primary flex-1">${isEdit?'שמירה':'יצירת לקוח'}</button>
          ${isEdit? `<button type="button" class="btn btn-danger" data-delete-client="${c.id}">${icon('trash',16)}</button>`:''}
        </div>
      </form>
    </div>
  `);
  document.getElementById('client-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    if(!data.status) data.status = 'lead';
    try{
      data.date_of_birth = readDMYField(fd, 'date_of_birth', 'תאריך לידה');
      data.partner_dob = readDMYField(fd, 'partner_dob', 'תאריך לידה (בן/בת זוג)');
    }catch(err){ toast(err.message); return; }
    if(isEdit){ await dbUpdate('clients', c.id, data); logActivity(c.id,'עודכנו פרטי לקוח'); toast('הלקוח עודכן'); }
    else{ const ref = await dbAdd('clients', data); if(ref) logActivity(ref.id, 'לקוח נוצר'); toast('הלקוח נוצר'); }
    closeModal(); render();
  });
  document.querySelector('[data-delete-client]')?.addEventListener('click', async ()=>{
    if(await askConfirm('למחוק את הלקוח לצמיתות?', {title:'מחיקת לקוח', danger:true})){ await dbDelete('clients', c.id); closeModal(); go('#/clients'); toast('הלקוח נמחק'); }
  });
}

/** Wires a record/stop toggle button to MediaRecorder; calls onDone(blob)
 *  once the user stops recording. Reused wherever a "הקלטה" button exists. */
function bindAudioRecorder(btn, statusEl, labelEl, onDone){
  if(!btn) return;
  let mediaRecorder = null, chunks = [], stream = null;
  btn.addEventListener('click', async ()=>{
    if(mediaRecorder && mediaRecorder.state==='recording'){
      mediaRecorder.stop();
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('הקלטה אינה נתמכת בדפדפן הזה'); return; }
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) chunks.push(e.data); };
      mediaRecorder.onstop = async ()=>{
        stream.getTracks().forEach(t=>t.stop());
        if(statusEl) statusEl.style.display='none';
        if(labelEl) labelEl.textContent='הקלטה';
        const blob = new Blob(chunks, {type:'audio/webm'});
        await onDone(blob);
        render();
      };
      mediaRecorder.start();
      if(statusEl) statusEl.style.display='block';
      if(labelEl) labelEl.textContent='עצירה';
    }catch(e){ toast('לא ניתן לגשת למיקרופון'); }
  });
}

    for(let i=0;i<sessions_per_day;i++) session_times.push(fd.get('session_time_'+i) || '10:00');

      logActivity(clientId, 'תוכנית עודכנה');
      toast('התוכנית עודכנה');
    } else {
      const ref = await dbAdd('programs', data);
      if(ref) await generateSessionsForProgram(data, ref);
      logActivity(clientId, `תוכנית חדשה נוצרה (${data.total_sessions} סשנים)`);
      toast('התוכנית נוצרה ולוח הסשנים חושב אוטומטית');
    }
    closeModal(); render();
  });
  document.querySelector('[data-delete-program]')?.addEventListener('click', async ()=>{
    if(await askConfirm('למחוק את התוכנית וכל הסשנים שלה לצמיתות?', {title:'מחיקת תוכנית', danger:true})){

      logActivity(clientId, 'תוכנית נמחקה');
      closeModal(); toast('התוכנית נמחקה'); render();
    }
  });
}

  const daysInMonth = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);

  S.tasks.filter(t=>t.due_date).forEach(t=>{ (eventsByDay[t.due_date] ||= {sessions:0,tasks:0}).tasks++; });

  const selDate = S.calSelected;
  const daySessions = S.sessions.filter(s=>s.session_date===selDate && s.status!=='completed').sort((a,b)=>(a.session_time||'').localeCompare(b.session_time||''));
  const dayTasks = S.tasks.filter(t=>t.due_date===selDate);

/** Computes the next date after this program's latest currently-scheduled
 *  session that matches its weekly pattern, and appends a fresh session
 *  there — used when a session is marked "postponed" so the client gets
 *  a make-up slot at the end of their schedule instead of losing it. */
async function postponeSession(session){
  const program = session.program_id ? S.programs.find(p=>p.id===session.program_id) : null;
  let nextDate;
  if(program && Array.isArray(program.weekly_days) && program.weekly_days.length){
    const progSessions = sessionsForProgram(program.id);
    const maxDateStr = progSessions.reduce((max,s)=> (s.session_date && s.session_date>max) ? s.session_date : max, program.start_date || session.session_date || todayIso());
    let d = new Date(maxDateStr+'T00:00:00'); d.setDate(d.getDate()+1);
    let guard=0;
    while(!program.weekly_days.includes(d.getDay()) && guard<400){ d.setDate(d.getDate()+1); guard++; }
    nextDate = ymd(d);
  } else {
    let d = new Date((session.session_date||todayIso())+'T00:00:00'); d.setDate(d.getDate()+7);
    nextDate = ymd(d);
  }
  await dbAdd('sessions', {
    program_id: session.program_id||'', client_id: session.client_id,
    session_date: nextDate, session_time: session.session_time||'',
    status:'scheduled', notes:'', images:[], assigned_to: session.assigned_to||'',
  });
  return nextDate;
}
async function setSessionStatus(session, newStatus){
  await dbUpdate('sessions', session.id, {status:newStatus});
  if(newStatus==='completed'){
    logActivity(session.client_id, 'סשן סומן כבוצע');
    toast('הסשן סומן כבוצע והוסר מהיומן');
  } else if(newStatus==='cancelled'){
    logActivity(session.client_id, 'סשן בוטל');
    toast('הסשן בוטל');
  } else if(newStatus==='postponed'){
    const nextDate = await postponeSession(session);
    logActivity(session.client_id, `סשן נדחה — נוסף מועד חדש ל-${fmtDateShort(nextDate)}`);
    toast(`הסשן נדחה — נוסף מועד חדש ב-${fmtDateShort(nextDate)}`);
  }
  render();
}
function bindCalendar(){
  document.querySelector('[data-cal-prev]')?.addEventListener('click', ()=>{ S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()-1, 1); render(); });
  document.querySelector('[data-cal-next]')?.addEventListener('click', ()=>{ S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()+1, 1); render(); });

    </div>
  </div>`;
}
function bindSettings(){
  document.getElementById('org-form')?.addEventListener('submit', async e=>{
    e.preventDefault();
    const name = new FormData(e.target).get('name');
    if(S.db) await S.db.doc('org/main').set({name});
    S.org = {...S.org, name}; toast('נשמר'); render();
  });
  document.querySelector('[data-logout-settings]')?.addEventListener('click', async ()=>{
    if(await askConfirm('להתנתק ולהחליף משתמש?', {title:'החלפת משתמש'})){ localStorage.removeItem('displayName'); S.me=null; render(); }
  });
  document.querySelector('[data-export-json]')?.addEventListener('click', exportJson);
  document.querySelector('[data-export-zip]')?.addEventListener('click', exportZip);
  document.getElementById('import-file')?.addEventListener('change', e=>{
    const file = e.target.files[0]; if(file) handleImportFile(file); e.target.value='';
  });
  document.getElementById('media-folder-input')?.addEventListener('change', e=>{
    const files = e.target.files; if(files && files.length) handleMediaFolder(files); e.target.value='';
  });
  document.getElementById('media-map-input')?.addEventListener('change', e=>{
    const file = e.target.files[0]; if(file) handleMediaMapFile(file); e.target.value='';
  });
}

/* ============================== MODAL ============================== */
function showModal(innerHtml){
  closeDatePicker();
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" data-backdrop><div class="modal-panel fade-in" data-panel>${innerHtml}</div></div>`;
  root.querySelector('[data-backdrop]').addEventListener('click', e=>{ if(e.target.hasAttribute('data-backdrop')) closeModal(); });
  root.querySelector('[data-close]')?.addEventListener('click', closeModal);
  initDatePickers(root);
}
function closeModal(){ closeDatePicker(); document.getElementById('modal-root').innerHTML=''; }

/* ============================== POPUP DATE PICKER ============================== */
/** Wraps every [data-date-mask] text input with a small calendar-icon
 *  button that opens a click-to-pick month calendar (in DD/MM/YYYY),
 *  since native <input type=date> can't be forced into a fixed display
 *  format across browsers. */
function initDatePickers(root){
  root.querySelectorAll('[data-date-mask]').forEach(input=>{
    attachDateMask(input);
    const wrap = document.createElement('div');
    wrap.style.position = 'relative';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    input.style.paddingLeft = '36px';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-btn';
    btn.setAttribute('data-date-toggle','1');
    btn.title = 'בחירה מלוח שנה';
    btn.style.cssText = 'position:absolute; left:2px; top:50%; transform:translateY(-50%); width:30px; height:30px; color:var(--text-muted);';
    btn.innerHTML = icon('calendar',16);
    btn.addEventListener('click', ()=>{ DP.input===input ? closeDatePicker() : openDatePicker(input); });
    wrap.appendChild(btn);
  });
}
const DP = { input:null, viewMonth:null };
function closeDatePicker(){
  document.getElementById('date-picker-popup')?.remove();
  DP.input = null;
  document.removeEventListener('mousedown', onDocClickForPicker, true);
  window.removeEventListener('resize', closeDatePicker);
}
function onDocClickForPicker(e){
  const popup = document.getElementById('date-picker-popup');
  if(!popup || popup.contains(e.target) || e.target===DP.input || e.target.closest('[data-date-toggle]')) return;
  closeDatePicker();
}
function openDatePicker(input){
  closeDatePicker();
  DP.input = input;
  const iso = dmyToIso(input.value);
  let base = iso ? new Date(iso+'T00:00:00') : new Date();
  if(isNaN(base)) base = new Date();
  DP.viewMonth = new Date(base.getFullYear(), base.getMonth(), 1);
  renderDatePickerPopup();
  setTimeout(()=>{ document.addEventListener('mousedown', onDocClickForPicker, true); window.addEventListener('resize', closeDatePicker); }, 0);
}
function renderDatePickerPopup(){
  if(!DP.input) return;
  let popup = document.getElementById('date-picker-popup');
  if(!popup){ popup = document.createElement('div'); popup.id = 'date-picker-popup'; document.body.appendChild(popup); }
  popup.className = 'card p-3 fade-in';
  popup.style.cssText = 'position:fixed; z-index:200; width:260px;';
  const rect = DP.input.getBoundingClientRect();
  let top = rect.bottom + 6, left = rect.left;
  left = Math.min(Math.max(8,left), window.innerWidth-268);
  if(top > window.innerHeight-300) top = Math.max(8, rect.top-286);
  popup.style.top = top+'px'; popup.style.left = left+'px';

  const m = DP.viewMonth;
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
  const cells = []; for(let i=0;i<startOffset;i++) cells.push(null); for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const selectedIso = dmyToIso(DP.input.value);

  popup.innerHTML = `
    <div class="flex items-center justify-between mb-2">
      <button type="button" class="icon-btn" style="width:28px;height:28px;" data-dp-prev>${icon('chevR',15)}</button>
      <div class="font-semibold" style="font-size:13px;">${MONTHS_HE[m.getMonth()]} ${m.getFullYear()}</div>
      <button type="button" class="icon-btn" style="width:28px;height:28px;" data-dp-next>${icon('chevL',15)}</button>
    </div>
    <div class="grid grid-cols-7 gap-0.5 mb-1" style="color:var(--text-muted); font-size:10.5px; font-weight:700; text-align:center;">
      ${WEEKDAYS_SHORT.map(w=>`<div>${w}</div>`).join('')}
    </div>
    <div class="grid grid-cols-7 gap-0.5">
      ${cells.map(d=>{
        if(!d) return `<div></div>`;
        const iso = `${m.getFullYear()}-${pad2(m.getMonth()+1)}-${pad2(d)}`;
        return `<button type="button" class="day-cell ${iso===todayIso()?'today':''} ${iso===selectedIso?'selected':''}" style="font-size:12px;" data-dp-day="${iso}">${d}</button>`;
      }).join('')}
    </div>
    <button type="button" class="btn btn-ghost w-full mt-2" style="font-size:12px; padding:6px;" data-dp-today>היום</button>
  `;
  popup.querySelector('[data-dp-prev]').addEventListener('click', ()=>{ DP.viewMonth = new Date(m.getFullYear(), m.getMonth()-1, 1); renderDatePickerPopup(); });
  popup.querySelector('[data-dp-next]').addEventListener('click', ()=>{ DP.viewMonth = new Date(m.getFullYear(), m.getMonth()+1, 1); renderDatePickerPopup(); });
  popup.querySelectorAll('[data-dp-day]').forEach(el=>el.addEventListener('click', ()=>{
    DP.input.value = isoToDMY(el.getAttribute('data-dp-day'));
    DP.input.dispatchEvent(new Event('input', {bubbles:true}));
    closeDatePicker();
  }));
  popup.querySelector('[data-dp-today]').addEventListener('click', ()=>{
    DP.input.value = isoToDMY(todayIso());
    DP.input.dispatchEvent(new Event('input', {bubbles:true}));
    closeDatePicker();
  });
}

/** In-app replacement for window.confirm(). Native browser dialogs
 *  (confirm/alert/prompt) can be silently blocked when the page runs
 *  inside a sandboxed iframe (e.g. an embedded artifact preview), which
 *  would make every confirm()-gated action look like it does nothing. */
function askConfirm(message, opts={}){
  return new Promise(resolve=>{
    const danger = !!opts.danger;
    showModal(`<div class="p-5">
      <div class="font-bold text-lg mb-2">${esc(opts.title || 'אישור פעולה')}</div>
      <div style="white-space:pre-wrap; font-size:14px; color:var(--text-muted); line-height:1.6;" class="mb-5">${esc(message)}</div>
      <div class="flex gap-2">
        <button class="btn ${danger?'btn-danger':'btn-primary'} flex-1" data-confirm-yes>${danger?'מחיקה':'אישור'}</button>
        <button class="btn btn-ghost flex-1" data-confirm-no>ביטול</button>
      </div>
    </div>`);
    let settled = false;
    const finish = val => { if(settled) return; settled = true; closeModal(); resolve(val); };
    document.querySelector('[data-confirm-yes]')?.addEventListener('click', ()=>finish(true));
    document.querySelector('[data-confirm-no]')?.addEventListener('click', ()=>finish(false));
    document.querySelector('[data-backdrop]')?.addEventListener('click', e=>{ if(e.target.hasAttribute('data-backdrop')) finish(false); });
  });
}

/* ============================== INCOMING SHARE (Web Share Target) ============================== */
/** Called on boot (and again after sign-in): if the page was opened via
 *  the manifest's share_target redirect (?shared=1), pulls the files the
 *  service worker stashed in Cache Storage and opens the assignment modal. */
async function checkIncomingShare(){
  if(!S.me) return; // re-checked after setIdentity() once the query string is still there
  if(!('caches' in window)) return;
  const params = new URLSearchParams(location.search);
  if(params.get('shared')!=='1') return;
  try{
    const cache = await caches.open('mindflow-share-v1');
    const metaResp = await cache.match('/__share_meta__');
    if(!metaResp){ history.replaceState({}, '', location.pathname+location.hash); return; }
    const meta = await metaResp.json();
    const files = [];
    for(const f of (meta.files||[])){
      const fileResp = await cache.match(`/__share_file_${f.index}__`);
      if(fileResp){ const blob = await fileResp.blob(); files.push({blob, name:f.name, type:f.type||blob.type||'application/octet-stream'}); }
    }
    const keys = await cache.keys(); await Promise.all(keys.map(k=>cache.delete(k)));
    history.replaceState({}, '', location.pathname+location.hash);
    if(files.length) openIncomingShareModal(files);
  }catch(e){ console.error('incoming share error', e); }
}
function openIncomingShareModal(files){
  const state = { clientId:'', dest:'general' };
  function paint(){
    showModal(`
      <div class="p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-lg">${icon('sparkle',18)} קבצים שהתקבלו משיתוף</h2>
          <button class="icon-btn" data-close>${icon('x',18)}</button>
        </div>
        <div class="flex flex-col gap-2 mb-4">
          ${files.map(f=>`<div class="flex items-center gap-2 p-2 rounded-lg" style="background:var(--surface-2); font-size:13px;">
            ${f.type.startsWith('image/')?icon('image',16):icon('sparkle',16)}<span class="truncate">${esc(f.name)}</span>
          </div>`).join('')}
        </div>
        <label class="text-sm font-semibold">שיוך ללקוח
          <select id="share-client-select" class="mt-1">
            <option value="">בחרו לקוח…</option>
            ${S.clients.map(c=>`<option value="${c.id}" ${state.clientId===c.id?'selected':''}>${esc(c.full_name)}</option>`).join('')}
          </select>
        </label>
        ${state.clientId ? `<div class="mt-3">
          <div class="text-sm font-semibold mb-1">שיוך אל</div>
          <select id="share-dest-select">
            <option value="general">מדיה כללית של הלקוח</option>
            ${programsForClient(state.clientId).map(p=>`<option value="${p.id}">${p.title?esc(p.title):'תוכנית'} (${fmtDate(p.start_date)})</option>`).join('')}
          </select>
        </div>` : ''}
        <button type="button" class="btn btn-primary w-full mt-4" id="share-confirm-btn" ${state.clientId?'':'disabled'}>${icon('sparkle',16)} העלאה ושיוך</button>
      </div>
    `);
    document.getElementById('share-client-select').addEventListener('change', e=>{ state.clientId = e.target.value; state.dest='general'; paint(); });
    document.getElementById('share-dest-select')?.addEventListener('change', e=>{ state.dest = e.target.value; });
    document.getElementById('share-confirm-btn').addEventListener('click', ()=>{ if(state.clientId) confirmIncomingShare(files, state.clientId, state.dest); });
  }
  paint();
}
async function confirmIncomingShare(files, clientId, dest){
  if(!S.assets){ toast('העלאת קבצים לא זמינה — יש להגדיר Firebase Storage'); return; }
  closeModal();
  toast('מעלה קבצים…');
  const images=[], audios=[];
  for(const f of files){
    try{
      const fileObj = new File([f.blob], f.name, {type:f.type});
      const res = await S.assets.upload(fileObj, {type:f.type});
      if(f.type.startsWith('image/')) images.push({id:res.id, url:res.url});
      else audios.push({id:res.id, url:res.url, name:f.name});
    }catch(e){ console.error(e); }
  }
  const col = dest==='general' ? 'clients' : 'programs';
  const targetId = dest==='general' ? clientId : dest;
  const target = dest==='general' ? clientById(clientId) : S.programs.find(p=>p.id===dest);
  const patch = {};
  if(images.length) patch.gallery = [...((target&&target.gallery)||[]), ...images];
  if(audios.length) patch.audio = [...((target&&target.audio)||[]), ...audios];
  if(Object.keys(patch).length) await dbUpdate(col, targetId, patch);
  logActivity(clientId, `קובץ שותף מאפליקציה חיצונית ושויך${dest!=='general'?' לתוכנית':' למדיה הכללית'}`);
  toast(`נשמרו ${images.length+audios.length} קבצים`);
  render();
}

if('serviceWorker' in navigator){

  loadIdentity();
  S.route = location.hash || '#/dashboard';
